<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DeepFake Sentinel - Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="options-container">
    <h1>🛡️ DeepFake Sentinel Settings</h1>

    <div class="settings-section">
      <h2>General Settings</h2>
      <div class="setting-item">
        <label for="extension-enabled">Enable Extension</label>
        <input type="checkbox" id="extension-enabled" checked>
        <p class="setting-description">Enable or disable the extension globally</p>
      </div>
      <div class="setting-item">
        <label for="show-notifications">Show Notifications</label>
        <input type="checkbox" id="show-notifications" checked>
        <p class="setting-description">Display notifications when analysis is complete</p>
      </div>
    </div>

    <div class="settings-section">
      <h2>Analysis Settings</h2>
      <div class="setting-item">
        <label for="history-limit">History Limit</label>
        <input type="number" id="history-limit" value="50" min="10" max="500">
        <p class="setting-description">Maximum number of items to keep in history</p>
      </div>
      <div class="setting-item">
        <label for="max-file-size">Max File Size (MB)</label>
        <input type="number" id="max-file-size" value="100" min="10" max="1024">
        <p class="setting-description">Maximum file size to analyze</p>
      </div>
    </div>

    <div class="settings-section">
      <h2>Privacy & Data</h2>
      <button id="clear-data-btn" class="btn btn-danger" style="flex: none; width: auto;">Clear All Data</button>
      <span id="clear-status"></span>
    </div>

    <div class="settings-actions">
      <button id="save-settings-btn" class="btn btn-primary">💾 Save Settings</button>
      <button id="reset-settings-btn" class="btn btn-audio">↻ Reset to Defaults</button>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
